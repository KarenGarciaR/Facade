<!DOCTYPE html>
<html>
<head>
    <title>Sistema de Reservas - Facade</title>
    <style>
        body {
            font-family: Arial;
            background: linear-gradient(135deg, #667eea, #764ba2);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            background: white;
            padding: 40px;
            border-radius: 20px;
            width: 350px;
            box-shadow: 0px 15px 30px rgba(0,0,0,0.3);
            text-align: center;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background: #667eea;
            color: white;
            padding: 10px;
            width: 100%;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        h2 {
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <h2>Reservar Evento 🎟️</h2>

        <form action="/reservar" method="POST">
            <input type="text" name="usuario" placeholder="Tu nombre" required>
            <input type="date" name="fecha" required>
            <button type="submit">Reservar</button>
        </form>
    </div>

</body>
</html>
